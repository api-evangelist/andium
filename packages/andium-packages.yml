summary: >-
  Andium publishes no client SDK for any Andium API. What it does publish, first-party, are embedded
  Arduino libraries from its hardware side — two of them registered in the Arduino Library Manager
  index under an @andium.com maintainer address. They are client libraries for OTHER companies' APIs
  (Philips Hue, Amazon Dash Replenishment) plus a board library for Andium's own Anduino shield.
  Deliberately NOT wired as `SDKs` in apis.yml: none of them is a client for an Andium API.
