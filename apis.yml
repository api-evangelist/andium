aid: andium
name: Andium
description: >-
  Andium is a New York City based industrial IoT company that combines its own hardware and AI
  software into an end-to-end remote field monitoring platform for the energy sector. Its InSite
  smart camera and edge software watch remote oil and gas wellsites for methane leaks, flare and
  pilot-light outages, tank levels, liquid spills, fire and asset movement, and push real-time
  alerts to operators instead of sending crews to look. The company reports cutting site
  greenhouse-gas emissions by up to 65%, field operating costs by up to 45% and windshield time by
  80%, and raised a $21.7M Series B led by Aramco Ventures. Andium publishes no public developer
  program, documentation or specification for that monitoring platform; the only callable,
  machine-readable API surface on any andium.com host is the Universal Commerce Protocol MCP
  endpoint on its Shopify-backed merchandise storefront at shop.andium.com.
