apis:
- aid: andium:store-ucp
  name: Andium Store UCP / MCP
  description: >-
    The Universal Commerce Protocol shopping service on Andium's merchandise storefront, exposed as
    a Model Context Protocol endpoint over JSON-RPC 2.0. Thirteen tools cover catalog search and
    lookup, product detail, cart create/update/cancel, checkout create/update/complete/cancel and
    order read, each with a full JSON Schema 2020-12 input schema returned live from tools/list.
    Anonymous for reads; payment requires an explicit human approval step. The protocol
    implementation is Shopify's native UCP support, served from an Andium-controlled host.
  humanURL: https://shop.andium.com/agents.md
  baseURL: https://shop.andium.com/api/ucp/mcp
